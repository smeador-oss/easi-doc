<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>easi-doc – Simple Documentation Portal</title>
  <meta name="description" content="easi-doc — self-service documentation and data catalog portal">

  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/vendor/github.min.css" id="hljs-theme-light">
  <link rel="stylesheet" href="assets/vendor/github-dark.min.css" id="hljs-theme-dark" disabled>
</head>
<body>

  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <a class="header-left" id="header-home-link" href="#/" style="text-decoration:none;color:inherit">
        <img src="assets/images/easi-doc-logo.svg" alt="easi-doc" class="header-logo" id="header-logo">
        <div class="header-title" id="header-title">
          easi-doc <span>Simple Documentation Portal</span>
        </div>
      </a>
      <div class="header-center">
        <div class="header-separator"></div>
        <nav class="portal-nav" id="portal-nav" aria-label="Portal navigation"></nav>
      </div>
      <div class="header-right">
        <div class="search-bar" id="search-bar"></div>
        <button class="theme-toggle" id="about-btn" title="About this application" aria-label="About this application">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </button>
        <button class="theme-toggle" id="refresh-btn" title="Refresh content" aria-label="Refresh navigation and content">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle dark/light theme">
          <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Sidebar Navigation -->
    <nav class="app-sidebar" id="sidebar" aria-label="Documentation navigation"></nav>

    <!-- Main Content Area -->
    <main class="app-main" id="main-content" role="main">
      <div class="content-wrapper" id="content-area">
        <div data-slot="dashboard"></div>
      </div>
    </main>

    <!-- Right Rail – Table of Contents -->
    <aside class="app-rail" id="right-rail" aria-label="Table of contents">
      <div class="toc-title">On this page</div>
      <ul class="toc-list" id="toc-list"></ul>
    </aside>

  </div>

  <!-- Vendor Libraries -->
  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/vendor/mermaid.min.js"></script>

  <!-- CodeMirror 5 (loaded on demand by page-editor) -->
  <link rel="stylesheet" href="assets/vendor/codemirror/codemirror.css" id="codemirror-css">
  <script src="assets/vendor/codemirror/codemirror.js"></script>
  <script src="assets/vendor/codemirror/xml.js"></script>
  <script src="assets/vendor/codemirror/markdown.js"></script>
  <script src="assets/vendor/codemirror/javascript.js"></script>

  <!-- Application -->
  <script type="module" src="assets/js/app.js"></script>

</body>
</html>
